name: Deploy PHP Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: ${{ github.event.repository.id }}"
          echo "Owner ID: ${{ github.event.repository.owner.id }}"
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment artifact
        run: |
          zip -r application.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Upload artifact to S3
        id: artifact
        run: |
          KEY="releases/${GITHUB_SHA}.zip"
          aws s3 cp application.zip "s3://${{ secrets.DEPLOYMENT_BUCKET }}/${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Start CodeDeploy deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "${{ secrets.CODEDEPLOY_APPLICATION }}" \
            --deployment-group-name "${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }}" \
            --deployment-config-name "CodeDeployDefault.HalfAtATime" \
            --description "GitHub ${GITHUB_SHA}" \
            --s3-location bucket="${{ secrets.DEPLOYMENT_BUCKET }}",key="${{ steps.artifact.outputs.key }}",bundleType=zip \
            --query deploymentId \
            --output text)

          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id "${{ steps.deploy.outputs.deployment_id }}"

      - name: Deployment summary
        run: |
          echo "Deployment succeeded."
          echo "Commit: ${GITHUB_SHA}"
          echo "Deployment: ${{ steps.deploy.outputs.deployment_id }}"
